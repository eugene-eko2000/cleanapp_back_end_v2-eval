version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cleanapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cleanapp
      MYSQL_USER: cleanapp_user
      MYSQL_PASSWORD: cleanapp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: details_subscription_service
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_USER: cleanapp_user
      DB_PASSWORD: cleanapp_password
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 8080
      TRUSTED_PROXIES: "127.0.0.1,::1"
      JWT_SECRET: "your_jwt_secret"
      STRIPE_SECRET_KEY: "sk_test_your_stripe_test_key"
      STRIPE_WEBHOOK_SECRET: "whsec_your_webhook_secret"
      STRIPE_DETAILS_PRICE_ID: "price_your_details_price_id"
      SENDGRID_API_KEY: "your_sendgrid_api_key"
      SENDGRID_FROM_NAME: "CleanApp"
      SENDGRID_FROM_EMAIL: "info@cleanapp.io"
      SCHEDULER_INTERVAL_MINUTES: "60"
    depends_on:
      mysql:
        condition: service_healthy
    command: go run main.go

volumes:
  mysql_data:
